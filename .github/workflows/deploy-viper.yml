name: Deploy VIPER

on:
  push:
    branches: [main]

concurrency:
  group: deploy-viper
  # Serialize: FTP mirror --delete is non-atomic; cancelling mid-mirror can leave a transient gap.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Mirrors the netlify.toml build command + artifact guards.
        run: |
          rm -rf sites/viper/.astro node_modules/.astro
          npm run build --workspace=@garage/viper
          test -f sites/viper/dist/.htaccess
          test -f sites/viper/dist/admin/.htaccess
          test -f sites/viper/dist/index.html
          test -f sites/viper/dist/sw.js

      - name: Check deploy size against FTP quota
        # Infomaniak FTP quota is 10240 KiB (10 MiB) for the whole account.
        # lftp mirror --delete removes files BEFORE uploading replacements, so an
        # overflow aborts mid-mirror and leaves the live site partially updated
        # (that is what happened on run 39649198567: 3 gallery images 404'd).
        # Fail here instead, with the actual numbers.
        run: |
          limit=9961472  # 9.5 MiB, ~0.5 MiB below the 10 MiB quota
          bytes=$(du -sb sites/viper/dist | cut -f1)
          echo "dist: ${bytes} bytes; limit: ${limit} bytes"
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::dist is ${bytes} bytes, over the ${limit}-byte deploy budget (FTP quota 10 MiB). Shrink or remove images in sites/viper/public/images before pushing — a full mirror would abort and break the live site."
            exit 1
          fi

      - name: Deploy to Infomaniak over FTP
        # This hosting offers FTP only (no SSH/SFTP/FTPS — verified 2026-10-18).
        # lftp mirror --delete = the rsync-equivalent; .ftpquota stays untouched.
        env:
          FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
          FTP_USER: ${{ secrets.INFOMANIAK_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # The hosting caps the server at 50 concurrent FTP logins, so a busy
          # moment answers 421 "too many users" — a 4xx that lftp treats as
          # permanent unless net:persist-retries is set. Retry the whole mirror,
          # and mirror with one connection so we hold a single login slot.
          for attempt in 1 2 3; do
            if lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" -e "
              set ftp:ssl-allow false;
              set ftp:passive-mode true;
              set net:timeout 20;
              set net:max-retries 3;
              set net:persist-retries 8;
              set net:reconnect-interval-base 10;
              set mirror:parallel-transfer-count 1;
              mirror -R --delete --verbose -x '.ftpquota' sites/viper/dist/ /;
              bye"; then
              echo "deploy attempt ${attempt} succeeded"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::FTP deploy failed after 3 attempts (hosting allows 50 concurrent FTP users; 421 means the server was busy)."
              exit 1
            fi
            echo "::warning::deploy attempt ${attempt} failed — retrying in 30s"
            sleep 30
          done
