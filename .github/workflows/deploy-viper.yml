name: Deploy VIPER

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-viper
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Mirrors the netlify.toml build command + artifact guards.
        run: |
          rm -rf sites/viper/.astro node_modules/.astro
          npm run build --workspace=@garage/viper
          test -f sites/viper/dist/index.html
          test -f sites/viper/dist/sw.js

      - name: Prepare and validate Cloudflare assets
        # Copies deploy/cloudflare/{_headers,_redirects,.assetsignore} into dist/
        # and fails if the limits, header scopes, or redirect rules are wrong.
        run: node sites/viper/scripts/prepare-cloudflare-dist.mjs

      - name: Deploy to Cloudflare Workers
        working-directory: sites/viper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
