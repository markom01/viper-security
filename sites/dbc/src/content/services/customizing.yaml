title: Automotive Customizing & Design Projects
slug: customizing
description: Bespoke design and build projects — restomod, widebody, interior and show-grade finishing.
hero:
  subtitle: Bespoke design and build — cars and motorcycles, from restomod to show-grade.
  cta_text: Get A Quote
  tagline: Customize · Design · Build
  image: /images/cms/black-mercedes-g63-studio-side.webp
form_fields:
  - label: Project type
    placeholder: Select project type...
    name: project_type
    type: select
    options:
      - Restomod
      - Widebody
      - Interior
      - Design
    side: ""
  - label: Vehicle (make & model)
    placeholder: Start typing — e.g. Ferrari 812
    name: vehicle_model
    type: vehicle
    cars_only: false
    other_vehicles: true
  - label: Budget
    placeholder: Approximate budget
    name: budget
    type: number
    side: ""
marquee: Custom Builds · Design · Repair · Motorcycles
about_text: An in-house design studio and build shop for custom cars and motorcycles — from Harley-Davidson and Indian customs to restomods, widebodies and show-grade finishes — plus general repair and maintenance.
include:
  - title: Custom Builds & Body Kits
    text: Vision-to-show-floor builds — body kits and bumpers fabricated in metal, hand powder-coated.
    image: /images/cms/gallery/black-hummer-h2-render-front.webp
  - title: Custom Motorcycles
    text: Harley-Davidson, Indian and one-offs — flame tanks, bars and full builds, painted by hand.
    image: /images/cms/gallery/airbrushing-flame-helmet-in-workshop.webp
  - title: Design Projects
    text: Concept, industrial and interior design from our in-house studio.
    image: /images/cms/gallery/van-interior-seat-layout-sketch.webp
  - title: Repair & Maintenance
    text: General service and maintenance for cars and motorcycles.
    image: /images/cms/gallery/db-custom-garage-workshop-with-cars.webp
fleet: []
stats:
  heading: Crafted In-House, End to End
  subheading: Design, fabrication and finish — one roof, by hand.
  image: /images/cms/gallery/matte-black-jeep-wrangler-render.webp
  items:
    - label: "1"
      title: In-house design studio & build shop
    - label: "100%"
      title: Fabricated in-house — not bought off the shelf
    - label: "2"
      title: Cars & motorcycles covered
    - label: "5"
      title: Stage process — sketch to street
steps:
  - title: Vision & Scope
    description: We sit down and define the build — restomod, widebody, interior or show-grade — plus budget and timeline.
  - title: Design & Fabrication
    description: In-house studio draws it, then metal is fabricated and powder-coated by hand. No off-the-shelf parts.
  - title: Finish & Delivery
    description: Paint, trim and final assembly, then a shakedown so the build leaves show-ready — on the road or on the street.
howitworks:
  heading: How Your Build Comes Together
cta:
  heading: Ready to Build Your Dream?
  text: Cars or motorcycles — tell us the vision and we take it from sketch to street.
  image: /images/cms/gallery/black-jeep-wrangler-towing-turatello-trailer.webp
bottomcta:
  heading: Your Dream Build, Done
  values:
