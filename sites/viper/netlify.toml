[build]
  command = "rm -rf .astro node_modules/.astro && npm run build --workspace=@garage/viper"
  publish = "sites/viper/dist"

# Runs Lighthouse on every deploy (push + API-triggered). Replaces the UI-only plugin.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# PWA web manifest correct MIME type.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Service worker must never be CDN-cached long — SW updates need fresh fetch.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers — main site (strict). No 'unsafe-inline' on script-src:
# all executable scripts are bundled modules ('self'); JSON-LD + hero data ship
# as inert application/json tags (CSP ignores them). Inline <style> blocks are
# still allowed (style-src 'unsafe-inline') — Astro emits them per-component.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Security headers — CMS admin (Sveltia CMS: no unsafe-eval, GitHub backend)
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' blob: https://unpkg.com https://github.com https://*.github.com https://*.githubusercontent.com https://api.github.com; frame-src 'none'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
