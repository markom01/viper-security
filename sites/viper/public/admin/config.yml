                }
              - {
                  name: nav_about,
                  label: "Nav: About",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_services,
                  label: "Nav: Services",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_armoredVehicles,
                  label: "Nav Service: Vehicle Armoring",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_luxuryCarsSale,
                  label: "Nav Service: Sale of Luxury Cars",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_fleet,
                  label: "Nav: Fleet",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_howItWorks,
                  label: "Nav: How It Works",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_pricing,
                  label: "Nav: Pricing",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_contact,
                  label: "Nav: Contact",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_stats,
                  label: "Nav: Why VIPER (Stats)",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_membership,
                  label: "Nav: Membership",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_ctaBanner,
                  label: "Nav: First Experience",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_bottomCta,
                  label: "Nav: Begin Your Journey",
                  widget: string,
                  required: false,
                }
              - {
                  name: nav_gallery,
                  label: "Nav: Gallery",
                  widget: string,
                  required: false,
                }
              - {
                  name: gallery_heading,
                  label: "Gallery Heading",
                  widget: string,
                  required: false,
                }
              - {
                  name: gallery_subheadline,
                  label: "Gallery Subheadline",
                  widget: text,
                  required: false,
                }
              - {
                  name: marquee_text,
                  label: "Marquee Text (scrolling band)",
                  widget: string,
                  required: false,
                }
              - {
                  name: hero_learnMore,
                  label: "Hero: Learn More",
                  widget: string,
                  required: false,
                }
              - {
                  name: hero_exploreFleet,
                  label: "Hero: Explore Fleet",
                  widget: string,
                  required: false,
                }
              - {
                  name: bottomCta_buttonFleet,
                  label: "Bottom CTA: Second Button",
                  widget: string,
