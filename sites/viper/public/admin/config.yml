            }
          - { name: image, label: "SEO Image", widget: image, required: false }

  - name: currently-selling
    label: Currently Selling
    description: Vehicles currently available for sale (one file per vehicle). The card title is built from the vehicle make, model and year.
    # Entry label in the collection list/editor: recomputed from the vehicle
    # fields, so it follows make/model/year edits instead of the file slug.
    summary: "{{vehicle.year}} {{vehicle.make}} {{vehicle.model}}"
    folder: sites/viper/src/content/currently-selling
    extension: yaml
    create: true
    # Slugs are sequential (`1`, `2`, …) because the file name never appears on
    # the site; the card title comes from the vehicle fields via `summary`.
    slug:
      auto_increment: true
    fields:
      - name: vehicle
        label: "Vehicle (NHTSA lookup)"
        widget: nhtsa_vehicle
        required: true
        # Subfield metadata only: lets Sveltia resolve the nested `vehicle.*`
        # tags used by the `summary` label. The widget stores all four keys as
        # one object, exactly as before.
        fields:
          - { name: category, label: Category, widget: string, required: false }
          - { name: make, label: Make, widget: string, required: false }
          - { name: model, label: Model, widget: string, required: false }
          - { name: year, label: Year, widget: string, required: false }
      - { name: description, label: Description, widget: text, required: false }
      - {
          name: images,
          label: "Gallery Images",
          widget: image,
          multiple: true,
          required: false,
          hint: "Pick or upload several photos. More than one photo gives the card a carousel on the site.",
        }
