      - label: "Form Fields"
        name: form_fields
        widget: list
        summary: "{{fields.label}}"
        collapsed: true
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - {
              name: placeholder,
              label: Placeholder,
              widget: string,
              required: false,
            }
          - { name: name, label: "Field Name", widget: string }
          - {
              name: type,
              label: Type,
              widget: select,
              options: [text, location, country, vehicle, select, number],
              required: false,
            }
          - {
              name: options,
              label: "Dropdown Options (only for Type = select)",
              widget: list,
              field: { name: option, label: Option, widget: string },
              required: false,
