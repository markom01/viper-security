                }
              - {
                  name: form_bookNow,
                  label: "Form: Book Now",
                  widget: string,
                  required: false,
                }
              - {
                  name: form_name,
                  label: "Form: Name",
                  widget: string,
                  required: false,
                }
              - {
                  name: form_phone,
                  label: "Form: Phone",
                  widget: string,
                  required: false,
                }
              - {
                  name: form_date,
                  label: "Form: Date",
                  widget: string,
                  required: false,
