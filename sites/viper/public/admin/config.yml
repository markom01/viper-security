          - {
              name: footer_company_info,
              label: "Footer Company Info (under logo, blank hides it)",
              widget: text,
              required: false,
            }
          - {
              name: fleetHeading,
              label: "Fleet Section Heading",
              widget: string,
              required: false,
            }
          - {
              name: howItWorksHeading,
              label: "How It Works Heading",
              widget: string,
              required: false,
