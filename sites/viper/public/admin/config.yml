# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: markom01/viper-security
  branch: main
  # Netlify's OAuth gateway completes its popup handshake only when the CMS is
  # served from the Netlify site's own domain, so GitHub-button login cannot
  # work from vipersecurity.ch. Token login is Netlify-free and is the
  # supported auth method here. To restore a GitHub button later, deploy a
  # self-hosted OAuth client (e.g. Sveltia CMS Authenticator) and set base_url.
  auth_methods: ["token"]

media_folder: sites/viper/public/images/cms
public_folder: /images/cms

collections:
  - name: gallery
    label: Gallery
    description: Site gallery images (one entry per photo)
    folder: sites/viper/src/content/gallery
    extension: yaml
    create: true
    slug: "{{slug}}"
    fields:
      - { name: name, label: Title, widget: string }
      - { name: alt, label: Alt Text, widget: string, required: false }
      - {
          name: category,
          label: Category,
          widget: select,
          options: [armored-vehicles, luxury-cars-sale],
          default: armored-vehicles,
        }
      - { name: image, label: Image, widget: image }

  - name: home
    label: Home Page
    description: Homepage hero banner + services summary grid
    files:
      - name: content
        label: Home Content
        file: sites/viper/src/content/home/content.yaml
        fields:
          - label: Hero
            name: hero
            widget: object
            collapsed: true
            fields:
              - {
                  name: brand_name,
                  label: Brand Name,
                  widget: string,
                  required: false,
                }
              - {
                  name: tagline,
                  label: Tagline,
                  widget: string,
                  required: false,
                }
              - {
                  name: subtitle,
                  label: Subtitle,
                  widget: text,
                  required: false,
                }
              - {
                  name: cta_text,
                  label: CTA Button Text,
                  widget: string,
                  required: false,
                }
              - {
                  name: hero_image,
                  label: "Hero Background Image",
                  widget: image,
                  required: false,
                }
              - {
                  name: phone_italy,
                  label: "Phone (Italy)",
                  widget: string,
                  required: false,
                }
              - {
                  name: phone_spain,
                  label: "Phone (Spain)",
                  widget: string,
                  required: false,
                }
          - label: Services
            name: services
            widget: object
            collapsed: true
            fields:
              - label: Offerings
                name: offerings
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - {
                      name: region,
                      label: "Region (Marbella or Milano)",
                      widget: string,
                    }
                  - { name: title, label: Service Title, widget: string }
                  - { name: description, label: Description, widget: text }
                  - {
                      name: image,
                      label: "Service Image",
                      widget: image,
                      required: false,
                    }
                  - {
                      name: slug,
                      label: "Slug (URL path)",
                      widget: string,
                      required: false,
                    }

  - name: fleet
    label: Fleet
    description: Vehicle fleet (one file per vehicle)
    folder: sites/viper/src/content/fleet
    extension: yaml
    create: true
    slug: "{{fields.name}}"
    fields:
      - { name: name, label: Vehicle Name, widget: string }
      - { name: image, label: "Vehicle Image", widget: image, required: false }
      - { name: type, label: Vehicle Type, widget: string, required: false }
      - {
          name: year,
          label: Year,
          widget: number,
          value_type: int,
          required: false,
        }
      - {
          name: seats,
          label: Seats,
          widget: number,
          value_type: int,
          required: false,
        }
      - {
          name: baggage,
          label: Baggage Capacity,
          widget: number,
          value_type: int,
          required: false,
        }
      - {
          name: capacity_passengers,
          label: Max Passengers,
          widget: number,
          value_type: int,
          required: false,
        }
      - {
          name: capacity_suitcases,
          label: Max Suitcases,
          widget: number,
          value_type: int,
          required: false,
        }
      - {
          name: capacity_carryon,
          label: Max Carry-On Bags,
          widget: number,
          value_type: int,
          required: false,
        }
      - label: Specs
        name: specs
        widget: list
        summary: "{{fields.label}}: {{fields.value}}"
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - { name: value, label: Value, widget: string }
      - label: Features
        name: features
        widget: list
        field: { label: Feature, name: feature, widget: string }
        required: false

  - name: pricing
    label: Hourly Pricing
    description: Hourly chauffeur service rates
    files:
      - name: hourly
        label: Hourly Rates
        file: sites/viper/src/content/pricing/hourly.yaml
        fields:
          - { name: type, widget: hidden, default: hourly }
          - label: Rates
            name: rates
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Duration, widget: string }
              - { name: price, label: Price, widget: string }

  - name: membership
    label: VIP Membership
    description: VIP membership program tiers
    files:
      - name: tiers
        label: Membership Tiers
        file: sites/viper/src/content/membership/tiers.yaml
        fields:
          - label: Tiers
            name: tiers
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Tier Name, widget: string }
              - { name: price, label: Annual Price, widget: string }
              - {
                  name: hours,
                  label: "Included Hours / Year",
                  widget: number,
                  required: false,
                }
              - label: Benefits
                name: benefits
                widget: list
                field: { label: Benefit, name: benefit, widget: string }
              - {
                  name: is_featured,
                  label: Featured Tier,
                  widget: boolean,
                  default: false,
                }

  - name: site
    label: Site Globals
    description: Site-wide labels, SEO, JSON-LD, booking routes, and shared sections
    files:
      - name: content
        label: Site Content
        file: sites/viper/src/content/site/content.yaml
        fields:
          - name: jsonld
            label: JSON-LD / Structured Data
            widget: object
            collapsed: true
            fields:
              - {
                  name: org_name,
                  label: Organization Name,
                  widget: string,
                  required: false,
                }
              - {
                  name: org_url,
                  label: Organization URL,
                  widget: string,
                  required: false,
                }
              - {
                  name: org_logo,
                  label: Organization Logo,
                  widget: image,
                  required: false,
                  hint: "Used in structured data (JSON-LD) and as a fallback social image.",
                }
              - {
                  name: org_description,
                  label: Description,
                  widget: text,
                  required: false,
                }
              - {
                  name: phoneSpain,
                  label: "Phone (Spain)",
                  widget: string,
                  required: false,
                }
              - {
                  name: phoneItaly,
                  label: "Phone (Italy)",
                  widget: string,
                  required: false,
                }
              - {
                  name: webSiteName,
                  label: "Website Name",
                  widget: string,
                  required: false,
                }
              - {
                  name: webSiteUrl,
                  label: "Website URL",
                  widget: string,
                  required: false,
                }
              - {
                  name: privacy_policy,
                  label: "Privacy Policy URL",
                  widget: string,
                  required: false,
                }
          - name: booking_data
            label: Booking Routes
            widget: object
            collapsed: true
            fields:
              - label: Spain
                name: spain
                widget: object
                fields:
                  - {
                      name: label,
                      label: "Region Label",
                      widget: string,
                      required: false,
                    }
                  - {
                      name: short_label,
                      label: "Short Region Name",
                      widget: string,
                      required: false,
                    }
                  - {
                      name: region,
                      label: Region,
                      widget: string,
                      required: false,
                    }
                  - label: Services
                    name: services
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - { name: name, label: "Service Name", widget: string }
                      - label: Routes
                        name: routes
                        widget: list
                        summary: "{{fields.route}}"
                        fields:
                          - { name: route, label: Route, widget: string }
                          - {
                              name: price,
                              label: "Price (optional)",
                              widget: string,
                              required: false,
                            }
              - label: Italy
                name: italy
                widget: object
                fields:
                  - {
                      name: label,
                      label: "Region Label",
                      widget: string,
                      required: false,
                    }
                  - {
                      name: short_label,
                      label: "Short Region Name",
                      widget: string,
                      required: false,
                    }
                  - {
                      name: region,
                      label: Region,
                      widget: string,
                      required: false,
                    }
                  - label: Services
                    name: services
                    widget: list
                    summary: "{{fields.name}}"
                    fields:
                      - { name: name, label: "Service Name", widget: string }
                      - label: Routes
                        name: routes
                        widget: list
                        summary: "{{fields.route}}"
                        fields:
                          - { name: route, label: Route, widget: string }
                          - {
                              name: price,
                              label: "Price (optional)",
                              widget: string,
                              required: false,
                            }
          - label: "Booking Service Form Fields"
            name: service_fields
            widget: list
            summary: "{{fields.name}}"
            collapsed: true
            required: false
            fields:
              - { name: name, label: "Service Name", widget: string }
              - label: "Form Fields"
                name: form_fields
                widget: list
                summary: "{{fields.label}}"
                collapsed: true
                required: false
                fields:
                  - { name: label, label: Label, widget: string }
                  - {
                      name: placeholder,
                      label: Placeholder,
                      widget: string,
                      required: false,
                    }
                  - { name: name, label: "Field Name", widget: string }
                  - {
                      name: type,
                      label: Type,
                      widget: select,
                      options:
                        [text, location, country, vehicle, select, number],
                      required: false,
                    }
                  - {
                      name: options,
                      label: "Dropdown Options (only for Type = select)",
                      widget: list,
                      field: { name: option, label: Option, widget: string },
                      required: false,
                    }
                  - {
                      name: cars_only,
                      label: "Cars only (hide vehicle type selector)",
                      widget: boolean,
                      required: false,
                    }
                  - {
                      name: side,
                      label: Side,
                      widget: select,
                      options: [left, right],
                      required: false,
                    }
          - {
