  - name: service
    label: Services
    description: Only Vehicle Armoring and Sale of Luxury Cars live here and generate detail pages. Chauffeur form fields live under Site Globals → Booking Routes → service_fields.
    folder: sites/viper/src/content/services
    extension: yaml
    create: true
    slug: "{{fields.title}}"
    fields:
      - { name: title, label: Service Title, widget: string }
      - {
          name: slug,
          label: "Slug (URL path override)",
          widget: string,
          required: false,
        }
      - { name: description, label: Description, widget: text, required: false }
      - label: Hero
        name: hero
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: subtitle, label: Subtitle, widget: text, required: false }
          - {
              name: cta_text,
              label: "CTA Button Text",
