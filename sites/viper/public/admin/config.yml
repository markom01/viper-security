      - label: "Fleet Section (Currently Selling)"
        name: fleet_section
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: heading, label: Heading, widget: string, required: false }
          - {
              name: subheadline,
              label: Subheadline,
              widget: string,
              required: false,
            }
      - label: "Include (service cards)"
        name: include
        widget: list
        summary: "{{fields.title}}"
        collapsed: true
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: text, label: Text, widget: text }
          - { name: image, label: Image, widget: image, required: false }
      - label: "Stats (per-service)"
        name: stats
        widget: object
        collapsed: true
        required: false
        fields:
          - {
              name: heading,
              label: "Section Heading (optional)",
              widget: string,
              required: false,
            }
          - {
              name: subheading,
              label: Subheading,
              widget: text,
              required: false,
            }
          - {
              name: image,
              label: "Background Image (optional)",
              widget: image,
              required: false,
            }
          - label: Items
            name: items
            widget: list
            summary: "{{fields.label}}: {{fields.title}}"
            required: false
            fields:
              - { name: label, label: "Label (e.g. 99%)", widget: string }
              - { name: title, label: "Title", widget: string }
      - label: "How It Works Steps"
        name: steps
        widget: list
        summary: "{{fields.title}}"
        collapsed: true
        required: false
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text }
      - label: "How It Works Heading (per-service)"
        name: howitworks
        widget: object
        collapsed: true
        required: false
        fields:
          - {
              name: heading,
              label: "Section Heading (optional)",
              widget: string,
              required: false,
            }
      - label: "Closing Banner"
        name: cta
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: heading, label: Heading, widget: string, required: false }
          - { name: text, label: Text, widget: text, required: false }
          - {
              name: image,
              label: "Image (optional, overrides hero fallback)",
              widget: image,
              required: false,
            }
      - label: "Final Banner"
        name: bottomcta
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: heading, label: Heading, widget: string, required: false }
          - label: Values
            name: values
            widget: list
            summary: "{{fields.title}}"
            required: false
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }
      - label: SEO
        name: seo
        widget: object
        collapsed: true
        required: false
        fields:
          - { name: title, label: "SEO Title", widget: string, required: false }
          - {
              name: description,
              label: "SEO Description",
              widget: text,
