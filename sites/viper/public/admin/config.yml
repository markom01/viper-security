          - {
              name: cars_only,
              label: "Cars only (hide vehicle type selector)",
              widget: boolean,
              required: false,
            }
          - {
              name: other_vehicles,
              label: "Other vehicles type option (free-text make/model)",
              widget: boolean,
              required: false,
            }
          - {
              name: side,
              label: Side,
              widget: select,
              options: [left, right],
              required: false,
            }
      - {
          name: marquee,
          label: "Marquee Text",
          widget: string,
          required: false,
        }
      - { name: about_text, label: "About Text", widget: text, required: false }
      - label: "About Images"
        name: about_images
        widget: list
