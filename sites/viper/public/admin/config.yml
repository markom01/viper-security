                }
              - { name: text, label: Body Text, widget: text, required: false }
              - {
                  name: image,
                  label: About Image,
                  widget: image,
                  required: false,
                }
              - {
                  name: images,
                  label: "About Carousel Images",
                  widget: list,
                  collapsed: true,
                  required: false,
                  field: { name: image, label: Image, widget: image },
                }
          - name: stats
            label: Stats Section
            widget: object
            collapsed: true
            required: false
            fields:
