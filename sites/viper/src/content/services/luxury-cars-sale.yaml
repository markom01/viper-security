title: Sale of Luxury Cars
slug: luxury-cars-sale
description: Curated sourcing, full inspection and delivery of luxury and executive cars.
hero:
  subtitle: Curated stock from trusted dealers and private sellers — inspected and delivered to your door.
  cta_text: Enquire About Stock
  tagline: Luxury Car Sales & Sourcing
  image: /images/cms/black-maybach-s-class-studio-side.webp
form_fields:
  - label: Details
    placeholder: Condition, mileage
    name: vehicle_details
    cars_only: false
  - label: Target price
    placeholder: Estimated value or target sale price
    name: target_price
    type: number
    cars_only: false
  - label: Vehicle (make & model)
    placeholder: Start typing — e.g. Ferrari 812
    name: vehicle_model
    type: vehicle
    cars_only: false
    other_vehicles: true
marquee: CURATED STOCK · INSPECTED · TRANSPARENT PRICE
about_text: We source luxury and executive cars to your exact spec, then inspect every vehicle for history and condition before it reaches you. Pricing is transparent, with trade-in welcome and clear guidance on financing. We finish with delivery and full registration support, so the car arrives ready to drive.
about_images:
  - /images/cms/mercedes-g63-black-exterior.webp
  - /images/cms/mercedes-g63-v8-biturbo-badge.webp
  - /images/cms/mercedes-g63-forged-wheel.webp
  - /images/cms/mercedes-g63-illuminated-door-sill.webp
fleet_section:
  heading: Currently Selling
  subheadline: Available now
include:
  - title: Tell Us Your Spec
    text: Share the make, model, budget and must-haves. We turn it into a search brief and confirm what is in stock right now.
    image: /images/cms/mercedes-g63-grey-rear.webp
  - title: Sourcing and Inspection
    text: We source from trusted dealers and private sellers, then check history, mileage and condition before shortlisting anything.
    image: /images/cms/maybach-s580-front.webp
  - title: Transparent Offer
    text: One transparent price with the full inspection report attached. Trade-in valued openly, financing options explained in plain terms.
    image: /images/cms/mercedes-g63-black-exterior.webp
  - title: Delivery and Handover
    text: Delivery to your door, with registration support and a full walkaround at handover.
    image: /images/cms/mercedes-g63-illuminated-door-sill.webp
stats:
  heading: Buy With Total Confidence
  subheading: Inspected luxury cars with transparent pricing and delivery.
  image: /images/cms/mercedes-g63-front-cabin-red-leather.webp
  items:
    - label: 100%
      title: Inspected history and condition
    - label: "1"
      title: Price agreed upfront
    - label: "0"
      title: Hidden fees
    - label: A-Z
      title: Delivery and registration handled
steps:
  - title: Enquire on WhatsApp
    description: Tell us the car you want or ask what is in stock. We reply fast with real availability and honest guidance.
  - title: Review the Report
    description: You get the full history and condition inspection plus one transparent price. No pressure, no hidden fees.
  - title: Take Delivery
    description: We deliver to your door, handle registration, and walk you through the car at handover.
