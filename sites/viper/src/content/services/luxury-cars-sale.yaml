include:
  - title: Tell Us Your Spec
    text: Share the make, model, budget and must-haves. We turn it into a search brief and confirm what is in stock right now.
    image: /images/cms/marketing-v2.webp
  - title: Sourcing and Inspection
    text: We source from trusted dealers and private sellers, then check history, mileage and condition before shortlisting anything.
    image: /images/cms/about-image-v2.webp
  - title: Transparent Offer
    text: One fixed price with the full inspection report attached. Trade-in valued openly, financing options explained in plain terms.
    image: /images/cms/corporate-travel.webp
  - title: Delivery and Handover
    text: Delivery to your door in Marbella or Milano, with registration support and a full walkaround at handover.
    image: /images/cms/airport-transfer.webp
