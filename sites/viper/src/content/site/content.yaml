about:
  heading: Discreet Luxury, Tailored to Every Journey
  text: >-
    "{site_name} delivers premium chauffeur-driven travel across {location1},
    {location2}, and beyond. Our {vehicle} and professional English-speaking
    chauffeur provide discreet, reliable transportation for airport transfers,
    business travel, VIP events, yacht transfers, and exclusive experiences.
    Every journey is tailored to your schedule with privacy, comfort, and
    punctuality at our core."
  image: /images/cms/black-mercedes-s-class-by-stone-building.webp
  images:
    - /images/cms/black-mercedes-s-class-by-stone-building.webp
    - /images/cms/chauffeur-driving-mercedes-s-class.webp
stats:
  heading: "Why Choose VIPER Security"
  subheading: >-
    Every pickup flight-tracked, every journey quoted upfront, and every
    ride driven to one standard — 24/7.
  image: /images/cms/chauffeur-driving-mercedes-s-class.webp
  items:
    - label: "15"
      title: Years Driving Experience
    - label: "100"
      title: Happy Clients
    - label: "1"
      title: Trusted Hand
    - label: "24"
      title: Availability
